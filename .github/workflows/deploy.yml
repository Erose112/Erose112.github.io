name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Guard against shipping the old project-pages base after the move to
      # user site https://erose112.github.io/ (assets must be /assets/..., not
      # /portfolio-website/assets/...).
      - name: Verify root GitHub Pages asset paths
        run: |
          set -euo pipefail
          if grep -R -n 'portfolio-website' dist ; then
            echo '::error::dist still references /portfolio-website/; set vite base to "/"'
            exit 1
          fi
          if ! grep -E -n 'src="/assets/index-[^"]+\.js"' dist/index.html ; then
            echo '::error::dist/index.html missing root /assets/*.js script tag'
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4