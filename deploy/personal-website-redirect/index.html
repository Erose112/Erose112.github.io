<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=https://erose112.github.io/" />
    <link rel="canonical" href="https://erose112.github.io/" />
    <title>Redirecting…</title>
    <script>
      ;(function () {
        var target = 'https://erose112.github.io/'
        var hash = window.location.hash || ''
        var search = window.location.search || ''
        window.location.replace(target + search + hash)
      })()
    </script>
  </head>
  <body>
    <p>
      This site has moved to
      <a href="https://erose112.github.io/">erose112.github.io</a>.
    </p>
  </body>
</html>
